<!doctype html>
<html lang="id">
<head>

<title>Dash: siap</title>

<style>

    <div class="t" data-keep="sapaan">Selamat malam</div>

    <div class="hint" data-keep="petunjuk"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v11M6 6l4-4 4 4M4 11v6h12v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Bagikan tempat dari Google Maps</div>
  </div>
</main>
<script src="frame.js"></script>
