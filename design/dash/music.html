<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480">
<title>Dash: musik</title>
<link rel="stylesheet" href="dash.css">
</head>
<body>
<!-- Tampilan musik (Apple Music): sampul, judul, artis, progres, kontrol. Semua di atas road bar. -->
<main class="dash" data-road="Musik">
  <div class="music">
    <div class="art"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13" fill="none" stroke="var(--d-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="var(--d-muted)"/><circle cx="16.5" cy="16" r="2.5" fill="var(--d-muted)"/></svg></div>
    <div class="meta">
      <div class="ttl" data-keep="judul">Sisa Rasa</div>
      <div class="art2" data-keep="artis">Mahalini</div>
      <div class="bar"><i></i></div>
      <div class="time" data-keep="waktu"><span>1:24</span><span>3:56</span></div>
      <div class="ctrl" data-keep="kontrol">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </div>
    </div>
  </div>
</main>
<script src="frame.js"></script>
</body>
