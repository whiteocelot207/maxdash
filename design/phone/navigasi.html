<!-- Tab Navigasi: cari tujuan atau bagikan dari Google Maps. -->
<main class="screen">
  <h1>Navigasi</h1>
  <div class="status"><span class="chip on"><i></i>Dash terhubung</span><span class="chip on"><i></i>MapKit siap</span></div>

  <div class="field" style="margin-top:8px"><svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="#9aa0a8" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M12.5 12.5L16 16"/></svg><input type="search" placeholder="Cari tujuan atau alamat" aria-label="Cari tujuan"></div>

  <div class="caption">Di dash sekarang</div>

  <div class="caption">Sering ke</div>
  <div class="group">
    <div class="row has-ic"><span class="ic" style="background:#3a3a3c"><svg viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 17s6-5.5 6-10A6 6 0 0 0 3 7c0 4.5 6 10 6 10z"/><circle cx="9" cy="7" r="2"/></svg></span><span class="grow">Rumah<span class="sub">Jl. Melati No. 10</span></span><svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="row has-ic"><span class="ic" style="background:#3a3a3c"><svg viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 17s6-5.5 6-10A6 6 0 0 0 3 7c0 4.5 6 10 6 10z"/><circle cx="9" cy="7" r="2"/></svg></span><span class="grow">Kantor<span class="sub">Jl. Sudirman Kav. 52</span></span><svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
  <p class="foot">Rute memakai Apple Maps (gratis). Rambu batas kecepatan & nama jalan dikirim ke dash.</p>
