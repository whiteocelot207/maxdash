<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ponsel: Konfirmasi tujuan</title>
<link rel="stylesheet" href="phone.css">
</head>
<body>
<!-- Konfirmasi tujuan yang diterima dari Google Maps sebelum rute dibuat. -->
<main class="screen">
  <h1>Konfirmasi tujuan</h1>
  <div class="status"><span class="chip on"><i></i>Dash terhubung</span></div>

  <div class="card2" style="margin-top:8px">
    <div class="statline"><span class="k">Tujuan dari Google Maps</span></div>
    <div style="font-size:26px;font-weight:700;line-height:30px">Tugu Jogja</div>
    <div style="color:var(--muted)">Jl. Malioboro, Yogyakarta</div>
    <div class="meter"><i style="width:100%"></i></div>
    <div class="statline"><span class="k">Estimasi</span><span class="v">5.1 km · 15 mnt</span></div>
  </div>

  <div class="caption">Pratinjau di dash</div>
  <div class="preview"><iframe src="../dash/turn.html" title="Pratinjau dash" tabindex="-1"></iframe></div>

  <div class="spacer"></div>
  <a class="btn primary" href="home.html">Mulai navigasi</a>
  <a class="btn plain" href="navigasi.html">Batal</a>
  <p class="foot">Pastikan tujuan benar sebelum mulai. Jangan mengutak-atik ponsel saat berkendara.</p>
</main>
</body>
