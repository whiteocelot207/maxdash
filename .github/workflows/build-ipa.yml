name: build-ipa
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project (XcodeGen)
        working-directory: app
        run: brew install xcodegen && xcodegen generate

      - name: Vector tests (WAJIB lulus sebelum ke motor)
        working-directory: app
        run: |
          xcodebuild test \
            -project Maxdash.xcodeproj \
            -scheme Maxdash \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Build aplikasi (unsigned)
        working-directory: app
        run: |
          xcodebuild \
            -project Maxdash.xcodeproj \
            -scheme Maxdash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package .ipa
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Maxdash.app Payload/
          zip -qr Maxdash.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Maxdash-ipa
          path: app/Maxdash.ipa